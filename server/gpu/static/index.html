<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISF GPU Renderer</title>
    <style>
        :root {
            --bg: #000; --surface: #0a0a0a; --card: #111;
            --border: #222; --text: #fff; --text-dim: #888;
            --accent: #ff3b3b; --green: #22c55e; --yellow: #eab308;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg); color: var(--text);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* Header */
        header {
            display: flex; align-items: center; gap: 16px;
            padding: 10px 20px; background: var(--surface);
            border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        header h1 { font-size: 15px; font-weight: 600; white-space: nowrap; letter-spacing: 0.5px; }
        #shader-select {
            background: var(--card); color: var(--text); border: 1px solid var(--border);
            padding: 6px 12px; border-radius: 4px; font-size: 13px; outline: none;
            min-width: 200px; cursor: pointer;
        }
        #shader-select:focus { border-color: var(--accent); }
        .header-status {
            margin-left: auto; display: flex; align-items: center; gap: 12px;
        }
        #fps, #remote-fps {
            font-family: 'SF Mono', 'Consolas', monospace;
            color: var(--text-dim); font-size: 13px; white-space: nowrap;
        }
        #remote-fps { color: var(--green); display: none; }

        /* Main layout */
        main { flex: 1; display: flex; overflow: hidden; }
        .preview-container {
            flex: 1; display: flex; flex-direction: column; min-width: 0;
        }
        .preview {
            flex: 1; display: flex; align-items: center; justify-content: center;
            background: var(--bg); min-width: 0; position: relative;
        }
        .preview img {
            max-width: 100%; max-height: 100%; object-fit: contain;
            image-rendering: auto;
        }
        .preview-label {
            position: absolute; top: 8px; left: 12px;
            font-size: 10px; color: var(--text-dim); text-transform: uppercase;
            letter-spacing: 1px; opacity: 0.6;
        }

        /* Remote PIP preview */
        .remote-preview {
            display: none; height: 180px; flex-shrink: 0;
            border-top: 1px solid var(--border); position: relative;
            background: #050505;
        }
        .remote-preview.active { display: flex; align-items: center; justify-content: center; }
        .remote-preview img {
            max-width: 100%; max-height: 100%; object-fit: contain;
        }
        .remote-preview .preview-label { color: var(--green); }

        /* Side panel */
        .panel {
            width: 300px; flex-shrink: 0; background: var(--surface);
            border-left: 1px solid var(--border); overflow-y: auto;
            display: flex; flex-direction: column;
        }
        .panel-section {
            padding: 16px 16px 12px; border-bottom: 1px solid var(--border);
        }
        .panel-section:last-child { border-bottom: none; }
        .section-title {
            font-size: 11px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 1px; color: var(--text-dim); margin-bottom: 12px;
        }

        /* Remote connection panel */
        .remote-row { display: flex; gap: 6px; margin-bottom: 8px; }
        .remote-row input[type="text"] {
            flex: 1; background: var(--card); color: var(--text);
            border: 1px solid var(--border); padding: 5px 8px; border-radius: 4px;
            font-size: 12px; font-family: 'SF Mono', 'Consolas', monospace;
            outline: none;
        }
        .remote-row input[type="text"]:focus { border-color: var(--accent); }
        .remote-row input[type="text"]::placeholder { color: #444; }
        .connect-btn {
            padding: 5px 12px; background: var(--card); color: var(--text-dim);
            border: 1px solid var(--border); border-radius: 4px; font-size: 12px;
            cursor: pointer; white-space: nowrap; transition: all 0.15s;
        }
        .connect-btn:hover { border-color: var(--accent); color: var(--text); }
        .connect-btn.connected { border-color: var(--green); color: var(--green); }
        .remote-status {
            display: flex; align-items: center; gap: 6px;
            font-size: 11px; color: var(--text-dim);
        }
        .status-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--border); flex-shrink: 0;
        }
        .status-dot.connected { background: var(--green); }
        .status-dot.error { background: var(--accent); }
        .status-dot.connecting { background: var(--yellow); }
        .remote-info {
            font-size: 11px; color: var(--text-dim);
            font-family: 'SF Mono', 'Consolas', monospace;
            margin-top: 4px;
        }

        /* Controls */
        .control { margin-bottom: 10px; }
        .control-header {
            display: flex; justify-content: space-between; align-items: baseline;
            margin-bottom: 4px;
        }
        .control-label { font-size: 12px; color: var(--text-dim); }
        .control-value {
            font-size: 11px; font-family: 'SF Mono', 'Consolas', monospace;
            color: var(--text); min-width: 40px; text-align: right;
        }

        /* Range slider */
        input[type="range"] {
            -webkit-appearance: none; appearance: none; width: 100%; height: 4px;
            background: var(--border); border-radius: 2px; outline: none; cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 14px; height: 14px;
            background: var(--accent); border-radius: 50%; cursor: pointer;
            transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }
        input[type="range"]::-moz-range-thumb {
            width: 14px; height: 14px; background: var(--accent);
            border-radius: 50%; border: none; cursor: pointer;
        }
        input[type="range"]::-moz-range-track {
            height: 4px; background: var(--border); border-radius: 2px;
        }

        /* Checkbox */
        .control-checkbox {
            display: flex; align-items: center; gap: 8px; padding: 4px 0;
        }
        .control-checkbox input[type="checkbox"] {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
            border: 1px solid var(--border); border-radius: 3px; background: var(--card);
            cursor: pointer; position: relative; flex-shrink: 0;
        }
        .control-checkbox input[type="checkbox"]:checked {
            background: var(--accent); border-color: var(--accent);
        }
        .control-checkbox input[type="checkbox"]:checked::after {
            content: ''; position: absolute; left: 4px; top: 1px;
            width: 5px; height: 9px; border: solid var(--text);
            border-width: 0 2px 2px 0; transform: rotate(45deg);
        }
        .control-checkbox label { font-size: 12px; color: var(--text-dim); cursor: pointer; }

        /* Select dropdown */
        .control select {
            width: 100%; background: var(--card); color: var(--text);
            border: 1px solid var(--border); padding: 5px 8px; border-radius: 4px;
            font-size: 12px; outline: none; cursor: pointer;
        }
        .control select:focus { border-color: var(--accent); }

        /* Color picker */
        .control input[type="color"] {
            -webkit-appearance: none; appearance: none; width: 40px; height: 24px;
            border: 1px solid var(--border); border-radius: 4px; background: var(--card);
            cursor: pointer; padding: 2px;
        }
        .control input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        .control input[type="color"]::-webkit-color-swatch { border: none; border-radius: 2px; }

        /* Event button */
        .control button.event-btn {
            background: var(--card); color: var(--text-dim); border: 1px solid var(--border);
            padding: 4px 12px; border-radius: 4px; font-size: 12px; cursor: pointer;
        }
        .control button.event-btn:hover { border-color: var(--accent); color: var(--text); }
        .control button.event-btn:active { background: var(--accent); color: var(--text); }

        /* Point2D */
        .point2d-row { display: flex; gap: 8px; align-items: center; }
        .point2d-row .axis-label {
            font-size: 10px; color: var(--text-dim); width: 12px; flex-shrink: 0;
        }
        .point2d-row input[type="range"] { flex: 1; }
        .point2d-row .control-value { min-width: 32px; }

        /* Reset button */
        .reset-btn {
            width: 100%; padding: 8px; background: var(--card); color: var(--text-dim);
            border: 1px solid var(--border); border-radius: 4px; font-size: 12px;
            cursor: pointer; transition: all 0.15s;
        }
        .reset-btn:hover { border-color: var(--accent); color: var(--text); }

        /* Empty state */
        .empty-state {
            color: var(--text-dim); font-size: 12px; font-style: italic; padding: 8px 0;
        }

        /* Scrollbar */
        .panel::-webkit-scrollbar { width: 6px; }
        .panel::-webkit-scrollbar-track { background: transparent; }
        .panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .panel::-webkit-scrollbar-thumb:hover { background: #333; }
    </style>
</head>
<body>
    <header>
        <h1>ISF GPU Renderer</h1>
        <select id="shader-select"><option>Loading...</option></select>
        <div class="header-status">
            <span id="remote-fps"></span>
            <span id="fps">-- FPS</span>
        </div>
    </header>
    <main>
        <div class="preview-container">
            <section class="preview">
                <span class="preview-label">Local</span>
                <img id="stream" src="/api/isf/frame/stream" alt="ISF Preview">
            </section>
            <section class="remote-preview" id="remote-preview">
                <span class="preview-label">Remote</span>
                <img id="remote-stream" alt="Remote Preview">
            </section>
        </div>
        <aside class="panel">
            <div class="panel-section" id="remote-section">
                <div class="section-title">Remote Pod</div>
                <div class="remote-row">
                    <input type="text" id="remote-url" placeholder="http://pod-ip:8002" spellcheck="false">
                    <button class="connect-btn" id="connect-btn">Connect</button>
                </div>
                <div class="remote-status" id="remote-status">
                    <span class="status-dot" id="status-dot"></span>
                    <span id="status-text">Not connected</span>
                </div>
                <div class="remote-info" id="remote-info"></div>
            </div>
            <div class="panel-section" id="params-section">
                <div class="section-title">Parameters</div>
                <div id="params"><div class="empty-state">Loading shader...</div></div>
            </div>
            <div class="panel-section">
                <div class="section-title">Audio</div>
                <div id="audio"></div>
            </div>
            <div class="panel-section">
                <button class="reset-btn" id="reset-btn">Reset Defaults</button>
            </div>
        </aside>
    </main>

    <script>
    (() => {
        // State
        let currentInputs = [];
        let defaults = {};
        let currentShader = null;

        // Remote mirror state
        let remoteUrl = '';
        let remoteConnected = false;
        let remotePolling = null;

        // DOM refs
        const shaderSelect = document.getElementById('shader-select');
        const fpsDisplay = document.getElementById('fps');
        const remoteFpsDisplay = document.getElementById('remote-fps');
        const paramsContainer = document.getElementById('params');
        const audioContainer = document.getElementById('audio');
        const resetBtn = document.getElementById('reset-btn');
        const remoteUrlInput = document.getElementById('remote-url');
        const connectBtn = document.getElementById('connect-btn');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const remoteInfo = document.getElementById('remote-info');
        const remotePreview = document.getElementById('remote-preview');
        const remoteStream = document.getElementById('remote-stream');

        // Restore saved remote URL
        const savedUrl = localStorage.getItem('isf-remote-url');
        if (savedUrl) remoteUrlInput.value = savedUrl;

        // ── API helpers ──────────────────────────────────────────────
        async function api(method, path, body) {
            const opts = { method, headers: { 'Content-Type': 'application/json' } };
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch(path, opts);
            return res.json();
        }

        // Fire-and-forget POST to remote (no await, no error blocking)
        function mirrorToRemote(path, body) {
            if (!remoteConnected || !remoteUrl) return;
            const url = remoteUrl + path;
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            }).catch(() => {}); // silent — remote issues don't block local
        }

        // ── Format values for display ────────────────────────────────
        function fmt(val) {
            if (val == null) return '--';
            const n = Number(val);
            if (Number.isNaN(n)) return String(val);
            if (Number.isInteger(n)) return n.toString();
            if (Math.abs(n) >= 100) return n.toFixed(0);
            if (Math.abs(n) >= 10) return n.toFixed(1);
            return n.toFixed(2);
        }

        // ── Remote connection ─────────────────────────────────────────
        function setRemoteStatus(state, text, info) {
            statusDot.className = 'status-dot ' + state;
            statusText.textContent = text;
            remoteInfo.textContent = info || '';
            if (state === 'connected') {
                connectBtn.textContent = 'Disconnect';
                connectBtn.classList.add('connected');
                remoteFpsDisplay.style.display = '';
            } else {
                connectBtn.textContent = 'Connect';
                connectBtn.classList.remove('connected');
                remoteFpsDisplay.style.display = 'none';
                remoteFpsDisplay.textContent = '';
            }
        }

        async function connectRemote() {
            if (remoteConnected) {
                disconnectRemote();
                return;
            }

            let url = remoteUrlInput.value.trim();
            if (!url) return;
            // Normalize: ensure http:// and strip trailing slash
            if (!url.startsWith('http')) url = 'http://' + url;
            url = url.replace(/\/+$/, '');
            remoteUrl = url;
            remoteUrlInput.value = url;
            localStorage.setItem('isf-remote-url', url);

            setRemoteStatus('connecting', 'Connecting...', '');

            try {
                const res = await fetch(url + '/api/isf/status', { signal: AbortSignal.timeout(5000) });
                const data = await res.json();
                remoteConnected = true;
                setRemoteStatus('connected', 'Connected',
                    `${data.gpu || 'Unknown GPU'} / ${data.resolution || '?'}`);

                // Show remote preview
                remoteStream.src = url + '/api/isf/frame/stream';
                remotePreview.classList.add('active');

                // Sync current shader to remote
                if (currentShader) {
                    mirrorToRemote('/api/isf/load', { name: currentShader });
                    // Sync current params
                    const params = {};
                    for (const inp of currentInputs) {
                        if (inp.default != null) params[inp.name] = inp.default;
                    }
                    if (Object.keys(params).length) {
                        mirrorToRemote('/api/isf/params', params);
                    }
                }

                // Start polling remote status
                startRemotePolling();
            } catch (e) {
                setRemoteStatus('error', 'Connection failed', e.message || 'Unreachable');
                remoteConnected = false;
            }
        }

        function disconnectRemote() {
            remoteConnected = false;
            remoteUrl = '';
            setRemoteStatus('', 'Not connected', '');
            remoteStream.src = '';
            remotePreview.classList.remove('active');
            if (remotePolling) { clearInterval(remotePolling); remotePolling = null; }
        }

        function startRemotePolling() {
            if (remotePolling) clearInterval(remotePolling);
            remotePolling = setInterval(async () => {
                if (!remoteConnected) return;
                try {
                    const res = await fetch(remoteUrl + '/api/isf/status', { signal: AbortSignal.timeout(3000) });
                    const data = await res.json();
                    remoteFpsDisplay.textContent = `Remote: ${data.fps || '--'} FPS`;
                } catch {
                    setRemoteStatus('error', 'Connection lost', '');
                    remoteConnected = false;
                    remotePreview.classList.remove('active');
                    clearInterval(remotePolling);
                    remotePolling = null;
                }
            }, 2000);
        }

        connectBtn.addEventListener('click', connectRemote);
        remoteUrlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') connectRemote();
        });

        // ── Shader library ───────────────────────────────────────────
        async function loadLibrary() {
            const data = await api('GET', '/api/isf/library');
            if (!data.shaders || !data.shaders.length) {
                shaderSelect.innerHTML = '<option>No shaders found</option>';
                return;
            }

            // Only show generators (filters need inputImage we don't have)
            const generators = data.shaders.filter(s => s.is_generator);

            // Group by first category
            const groups = {};
            for (const s of generators) {
                const cat = (s.categories && s.categories[0]) || 'Other';
                (groups[cat] = groups[cat] || []).push(s);
            }

            // Sort categories: Generator first, then alpha
            const cats = Object.keys(groups).sort((a, b) => {
                if (a === 'Generator') return -1;
                if (b === 'Generator') return 1;
                return a.localeCompare(b);
            });

            shaderSelect.innerHTML = '';
            for (const cat of cats) {
                const og = document.createElement('optgroup');
                og.label = `${cat} (${groups[cat].length})`;
                for (const s of groups[cat].sort((a, b) => a.name.localeCompare(b.name))) {
                    const opt = document.createElement('option');
                    opt.value = s.name;
                    opt.textContent = s.name;
                    og.appendChild(opt);
                }
                shaderSelect.appendChild(og);
            }

            // Select current shader from status
            const status = await api('GET', '/api/isf/status');
            if (status.shader) {
                shaderSelect.value = status.shader;
                currentShader = status.shader;
                await loadShader(status.shader, true);
            }
        }

        // ── Load shader ──────────────────────────────────────────────
        async function loadShader(name, skipPost) {
            const data = await api('POST', '/api/isf/load', { name });
            if (data.status !== 'ok') return;

            currentShader = name;
            currentInputs = data.inputs || [];
            defaults = {};
            for (const inp of currentInputs) {
                defaults[inp.name] = inp.default;
            }
            buildControls(currentInputs);

            // Mirror shader load to remote
            mirrorToRemote('/api/isf/load', { name });
        }

        // ── Build parameter controls ─────────────────────────────────
        function buildControls(inputs) {
            paramsContainer.innerHTML = '';
            let hasControls = false;

            for (const inp of inputs) {
                if (inp.type === 'image') continue;
                const el = createControl(inp);
                if (el) {
                    paramsContainer.appendChild(el);
                    hasControls = true;
                }
            }

            if (!hasControls) {
                paramsContainer.innerHTML = '<div class="empty-state">No parameters</div>';
            }
        }

        function createControl(inp) {
            switch (inp.type) {
                case 'float': return makeSlider(inp);
                case 'bool': return makeCheckbox(inp);
                case 'long': return makeSelect(inp);
                case 'point2D': return makePoint2D(inp);
                case 'color': return makeColor(inp);
                case 'event': return makeEvent(inp);
                default: return null;
            }
        }

        // ── Float slider ─────────────────────────────────────────────
        function makeSlider(inp) {
            const div = document.createElement('div');
            div.className = 'control';
            const min = inp.min ?? 0;
            const max = inp.max ?? 1;
            const val = inp.default ?? min;
            const step = (max - min) <= 0 ? 0.01 : (max - min) / 200;

            div.innerHTML = `
                <div class="control-header">
                    <span class="control-label">${inp.label || inp.name}</span>
                    <span class="control-value">${fmt(val)}</span>
                </div>
                <input type="range" min="${min}" max="${max}" step="${step}" value="${val}">
            `;
            const slider = div.querySelector('input');
            const valSpan = div.querySelector('.control-value');
            slider.addEventListener('input', () => {
                const v = parseFloat(slider.value);
                valSpan.textContent = fmt(v);
                sendParam(inp.name, v);
            });
            return div;
        }

        // ── Bool checkbox ────────────────────────────────────────────
        function makeCheckbox(inp) {
            const div = document.createElement('div');
            div.className = 'control';
            const checked = inp.default ? 'checked' : '';
            div.innerHTML = `
                <div class="control-checkbox">
                    <input type="checkbox" id="cb-${inp.name}" ${checked}>
                    <label for="cb-${inp.name}">${inp.label || inp.name}</label>
                </div>
            `;
            div.querySelector('input').addEventListener('input', (e) => {
                sendParam(inp.name, e.target.checked);
            });
            return div;
        }

        // ── Long select ──────────────────────────────────────────────
        function makeSelect(inp) {
            const div = document.createElement('div');
            div.className = 'control';
            const labels = inp.labels || [];
            const values = inp.values || [];
            let options = '';
            if (labels.length) {
                for (let i = 0; i < labels.length; i++) {
                    const v = values[i] ?? i;
                    const sel = v === inp.default ? 'selected' : '';
                    options += `<option value="${v}" ${sel}>${labels[i]}</option>`;
                }
            } else {
                const lo = inp.min ?? 0;
                const hi = inp.max ?? 4;
                for (let i = lo; i <= hi; i++) {
                    const sel = i === inp.default ? 'selected' : '';
                    options += `<option value="${i}" ${sel}>${i}</option>`;
                }
            }
            div.innerHTML = `
                <div class="control-header">
                    <span class="control-label">${inp.label || inp.name}</span>
                </div>
                <select>${options}</select>
            `;
            div.querySelector('select').addEventListener('input', (e) => {
                sendParam(inp.name, parseInt(e.target.value, 10));
            });
            return div;
        }

        // ── Point2D ──────────────────────────────────────────────────
        function makePoint2D(inp) {
            const div = document.createElement('div');
            div.className = 'control';
            const def = Array.isArray(inp.default) ? inp.default : [0.5, 0.5];
            const minArr = Array.isArray(inp.min) ? inp.min : [0, 0];
            const maxArr = Array.isArray(inp.max) ? inp.max : [1, 1];

            div.innerHTML = `
                <div class="control-header">
                    <span class="control-label">${inp.label || inp.name}</span>
                </div>
                <div class="point2d-row" style="margin-bottom:4px">
                    <span class="axis-label">X</span>
                    <input type="range" min="${minArr[0]}" max="${maxArr[0]}" step="0.005" value="${def[0]}" data-axis="0">
                    <span class="control-value">${fmt(def[0])}</span>
                </div>
                <div class="point2d-row">
                    <span class="axis-label">Y</span>
                    <input type="range" min="${minArr[1]}" max="${maxArr[1]}" step="0.005" value="${def[1]}" data-axis="1">
                    <span class="control-value">${fmt(def[1])}</span>
                </div>
            `;
            const sliders = div.querySelectorAll('input[type="range"]');
            const vals = div.querySelectorAll('.control-value');
            const pt = [...def];
            sliders.forEach((s, i) => {
                s.addEventListener('input', () => {
                    pt[i] = parseFloat(s.value);
                    vals[i].textContent = fmt(pt[i]);
                    sendParam(inp.name, [...pt]);
                });
            });
            return div;
        }

        // ── Color picker ─────────────────────────────────────────────
        function makeColor(inp) {
            const div = document.createElement('div');
            div.className = 'control';
            const def = Array.isArray(inp.default) ? inp.default : [1, 0, 0, 1];
            const hex = rgbaToHex(def);
            div.innerHTML = `
                <div class="control-header">
                    <span class="control-label">${inp.label || inp.name}</span>
                    <input type="color" value="${hex}">
                </div>
            `;
            div.querySelector('input[type="color"]').addEventListener('input', (e) => {
                sendParam(inp.name, hexToRgba(e.target.value));
            });
            return div;
        }

        // ── Event button ─────────────────────────────────────────────
        function makeEvent(inp) {
            const div = document.createElement('div');
            div.className = 'control';
            div.innerHTML = `<button class="event-btn">${inp.label || inp.name}</button>`;
            div.querySelector('button').addEventListener('click', () => {
                sendParam(inp.name, true);
            });
            return div;
        }

        // ── Color helpers ────────────────────────────────────────────
        function rgbaToHex(rgba) {
            const r = Math.round((rgba[0] || 0) * 255).toString(16).padStart(2, '0');
            const g = Math.round((rgba[1] || 0) * 255).toString(16).padStart(2, '0');
            const b = Math.round((rgba[2] || 0) * 255).toString(16).padStart(2, '0');
            return `#${r}${g}${b}`;
        }

        function hexToRgba(hex) {
            return [
                parseInt(hex.slice(1, 3), 16) / 255,
                parseInt(hex.slice(3, 5), 16) / 255,
                parseInt(hex.slice(5, 7), 16) / 255,
                1.0
            ];
        }

        // ── Send param to server (local + remote mirror) ─────────────
        function sendParam(name, value) {
            const payload = { [name]: value };
            api('POST', '/api/isf/params', payload);
            mirrorToRemote('/api/isf/params', payload);
        }

        // ── Audio controls ───────────────────────────────────────────
        function buildAudio() {
            const bands = ['bass', 'mid', 'high'];
            const audioState = { bass: 0, mid: 0, high: 0 };

            for (const band of bands) {
                const div = document.createElement('div');
                div.className = 'control';
                div.innerHTML = `
                    <div class="control-header">
                        <span class="control-label">${band}</span>
                        <span class="control-value">0.00</span>
                    </div>
                    <input type="range" min="0" max="1" step="0.005" value="0">
                `;
                const slider = div.querySelector('input');
                const valSpan = div.querySelector('.control-value');
                slider.addEventListener('input', () => {
                    const v = parseFloat(slider.value);
                    valSpan.textContent = fmt(v);
                    audioState[band] = v;
                    api('POST', '/api/isf/audio', audioState);
                    mirrorToRemote('/api/isf/audio', audioState);
                });
                audioContainer.appendChild(div);
            }
        }

        // ── Reset defaults ───────────────────────────────────────────
        resetBtn.addEventListener('click', () => {
            if (!currentInputs.length) return;
            const params = {};
            for (const inp of currentInputs) {
                if (inp.default != null && inp.type !== 'image') {
                    params[inp.name] = inp.default;
                }
            }
            api('POST', '/api/isf/params', params);
            mirrorToRemote('/api/isf/params', params);
            buildControls(currentInputs);
        });

        // ── Shader select ────────────────────────────────────────────
        shaderSelect.addEventListener('change', () => {
            loadShader(shaderSelect.value);
        });

        // ── FPS polling ──────────────────────────────────────────────
        async function pollStatus() {
            try {
                const data = await api('GET', '/api/isf/status');
                fpsDisplay.textContent = `${data.fps || '--'} FPS`;
            } catch {}
            setTimeout(pollStatus, 1000);
        }

        // ── Init ─────────────────────────────────────────────────────
        async function init() {
            buildAudio();
            await loadLibrary();
            pollStatus();
        }

        init();
    })();
    </script>
</body>
</html>
